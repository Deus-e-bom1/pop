<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Informe seu CPF - Ecred</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --green-primary: #a3e635; --green-dark: #65a30d; --bg-light: #f8faf8; --text-dark: #111827; --text-gray: #6b7280; --white: #ffffff; --border-color: #e5e7eb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--white); padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--text-dark); text-decoration: none; }
        .logo span { color: var(--green-dark); }
        .back-link { color: var(--text-gray); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .progress-container { width: 100%; height: 4px; background-color: #e5e7eb; }
        .progress-bar { height: 100%; width: 40%; background-color: var(--green-primary); border-radius: 0 4px 4px 0; }
        main { flex: 1; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; max-width: 500px; margin: 0 auto; width: 100%; }
        .badge-simulacao { font-size: 11px; font-weight: 700; color: var(--text-gray); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 14px; color: var(--text-gray); text-align: center; margin-bottom: 30px; line-height: 1.5; }
        .form-card { background-color: var(--white); border-radius: 24px; padding: 30px 20px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 16px; color: var(--text-gray); outline: none; }
        .input-group input:focus { border-color: var(--green-primary); }
        .privacy-box { background-color: #e5e7eb; border-radius: 12px; padding: 15px; display: flex; align-items: flex-start; gap: 12px; }
        .privacy-box i { color: var(--text-gray); font-size: 16px; margin-top: 2px; }
        .privacy-box p { font-size: 12px; color: var(--text-gray); line-height: 1.5; }
        .btn-continue { background-color: var(--green-primary); color: var(--text-dark); text-decoration: none; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: transform 0.2s; border: none; cursor: pointer; }
        .btn-continue.disabled { background-color: #def2ad; color: #a3a3a3; cursor: not-allowed; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">ecred<span>.</span></a><a href="valor.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar</a></header>
    <div class="progress-container"><div class="progress-bar"></div></div>
    <main>
        <div class="badge-simulacao">PASSO 2</div>
        <h1>Informe seu CPF</h1>
        <p class="subtitle">Precisamos do seu CPF para prosseguir com a análise.</p>
        <div class="form-card">
            <div class="input-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
            </div>
            <div class="privacy-box">
                <i class="fa-solid fa-lock"></i>
                <p>Consulta protegida e sem custo. Seus dados são usados apenas para a análise de crédito, conforme a LGPD.</p>
            </div>
        </div>
        <button id="btn-continuar" class="btn-continue disabled" onclick="irParaConfirmacao()">Continuar <i class="fa-solid fa-arrow-right"></i></button>
    </main>
    <script>
        // 1. LÊ O VALOR DA URL
        const urlParams = new URLSearchParams(window.location.search);
        let valorRecebido = urlParams.get('valor');

        // 2. CONVERTE E SALVA NO LOCALSTORAGE NOVAMENTE
        // Se o valor veio na URL (ex: 15000), formatamos e salvamos
        if (valorRecebido) {
            let num = parseFloat(valorRecebido);
            if (!isNaN(num)) {
                let valorFormatado = num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                localStorage.setItem('ecred_valor', valorFormatado);
                
                // Também calculamos a parcela e salvamos, para a página de aprovação ficar certinha
                const taxaJurosMensal = 0.0081;
                const qtdParcelas = 12; // Padrão usado
                const fator = (taxaJurosMensal * Math.pow(1 + taxaJurosMensal, qtdParcelas)) / (Math.pow(1 + taxaJurosMensal, qtdParcelas) - 1);
                const valorParcela = num * fator;
                localStorage.setItem('ecred_parcela', valorParcela.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }));
                localStorage.setItem('ecred_prazo', qtdParcelas + ' meses');
            }
        }

        const cpfInput = document.getElementById('cpf');
        const btnContinuar = document.getElementById('btn-continuar');
        
        cpfInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = value;
            if (value.length === 14) btnContinuar.classList.remove('disabled');
            else btnContinuar.classList.add('disabled');
        });

        // 3. REDIRECIONA (A URL não precisa mais carregar o valor, pois está no localStorage)
        function irParaConfirmacao() {
            window.location.href = 'confirmacao.html';
        }
    </script>
</body>
</html>
