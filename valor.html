<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulação - Ecred</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --green-primary: #a3e635; --green-dark: #65a30d; --bg-light: #f8faf8; --text-dark: #111827; --text-gray: #6b7280; --white: #ffffff; --border-color: #e5e7eb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--white); padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--text-dark); text-decoration: none; }
        .logo span { color: var(--green-dark); }
        .back-link { color: var(--text-gray); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .progress-container { width: 100%; height: 4px; background-color: #e5e7eb; }
        .progress-bar { height: 100%; width: 30%; background-color: var(--green-primary); border-radius: 0 4px 4px 0; }
        main { flex: 1; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; max-width: 500px; margin: 0 auto; width: 100%; }
        .badge-simulacao { font-size: 11px; font-weight: 700; color: var(--text-gray); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 14px; color: var(--text-gray); text-align: center; margin-bottom: 30px; line-height: 1.5; }
        .simulator-card { background-color: var(--white); border-radius: 24px; padding: 30px 20px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .main-value { font-size: 36px; font-weight: 800; color: var(--text-dark); text-align: center; margin-bottom: 25px; letter-spacing: -1.5px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: var(--green-primary); border-radius: 5px; background-image: linear-gradient(to right, var(--green-primary) 0%, var(--green-primary) var(--percent), #e5f5ce var(--percent), #e5f5ce 100%); }
        input[type=range]::-webkit-slider-thumb { height: 24px; width: 24px; border-radius: 50%; background: var(--white); border: 2px solid var(--green-primary); cursor: pointer; -webkit-appearance: none; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .slider-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-gray); margin-bottom: 25px; margin-top: 10px; }
        .divider { height: 1px; background-color: var(--border-color); margin: 25px 0; }
        .parcelas-title { font-size: 15px; font-weight: 600; text-align: center; margin-bottom: 20px; }
        .parcelas-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .parcela-btn { background-color: #e5e7eb; border: none; padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-gray); cursor: pointer; transition: all 0.2s; }
        .parcela-btn.active { background-color: var(--green-primary); color: var(--text-dark); }
        .payment-details { background-color: #e5e7eb; border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .payment-left p { font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 4px; }
        .payment-left span { font-size: 12px; color: var(--text-gray); }
        .payment-right { text-align: right; }
        .payment-right h3 { font-size: 22px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
        .payment-right span { font-size: 12px; color: var(--text-gray); }
        .btn-continue { background-color: var(--green-primary); color: var(--text-dark); text-decoration: none; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: transform 0.2s; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">ecred<span>.</span></a><a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar</a></header>
    <div class="progress-container"><div class="progress-bar"></div></div>
    <main>
        <div class="badge-simulacao">SIMULAÇÃO</div>
        <h1>De quanto você precisa?</h1>
        <p class="subtitle">Arraste para escolher o valor. É grátis e sem compromisso.</p>
        <div class="simulator-card">
            <div class="main-value" id="display-valor">R$ 10.000,00</div>
            <input type="range" id="slider-valor" min="3000" max="20000" step="100" value="10000">
            <div class="slider-labels"><span>R$ 3.000</span><span>R$ 20.000</span></div>
            <div class="divider"></div>
            <p class="parcelas-title">Em quantas parcelas?</p>
            <div class="parcelas-grid">
                <button class="parcela-btn" data-parcelas="6" onclick="selecionarParcela(6, this)">6x</button>
                <button class="parcela-btn active" data-parcelas="12" onclick="selecionarParcela(12, this)">12x</button>
                <button class="parcela-btn" data-parcelas="18" onclick="selecionarParcela(18, this)">18x</button>
                <button class="parcela-btn" data-parcelas="24" onclick="selecionarParcela(24, this)">24x</button>
            </div>
            <div class="payment-details">
                <div class="payment-left"><p>Valor da parcela</p><span>Juros aprox. 0,81% a.m.</span></div>
                <div class="payment-right"><h3 id="display-parcela">R$ 877,86</h3><span id="display-total">Total: R$ 10.534,29</span></div>
            </div>
        </div>
        <!-- O link volta a ser simples e o clique salva no localStorage -->
        <a href="cpf.html" class="btn-continue" onclick="salvarDados()">Continuar com <span id="btn-valor">R$ 10.000,00</span> <i class="fa-solid fa-arrow-right"></i></a>
    </main>
    <script>
        let valorEmprestimo = 10000; 
        let qtdParcelas = 12; 
        const taxaJurosMensal = 0.0081;
        const formatarMoeda = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        
        function selecionarParcela(parcelas, btn) {
            document.querySelectorAll('.parcela-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            qtdParcelas = parcelas;
            atualizar();
        }
        
        function atualizar() {
            const slider = document.getElementById('slider-valor');
            const percent = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.setProperty('--percent', percent + '%');
            valorEmprestimo = parseFloat(slider.value);
            const valorFormatado = formatarMoeda(valorEmprestimo);
            document.getElementById('display-valor').textContent = valorFormatado;
            document.getElementById('btn-valor').textContent = valorFormatado;
            const i = taxaJurosMensal; const n = qtdParcelas;
            const fator = (i * Math.pow(1 + i, n)) / (Math.pow(1 + i, n) - 1);
            const valorParcela = valorEmprestimo * fator;
            document.getElementById('display-parcela').textContent = formatarMoeda(valorParcela);
            document.getElementById('display-total').textContent = "Total: " + formatarMoeda(valorParcela * n);
        }
        
        document.getElementById('slider-valor').addEventListener('input', atualizar);
        atualizar();

        // SALVA TODOS OS DADOS NECESSÁRIOS NO LOCALSTORAGE
        function salvarDados() {
            const slider = document.getElementById('slider-valor');
            const valor = parseFloat(slider.value);
            const valorFormatado = valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            
            const i = taxaJurosMensal; const n = qtdParcelas;
            const fator = (i * Math.pow(1 + i, n)) / (Math.pow(1 + i, n) - 1);
            const valorParcela = valor * fator;
            const parcelaFormatada = valorParcela.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            localStorage.setItem('ecred_valor', valorFormatado);
            localStorage.setItem('ecred_parcela', parcelaFormatada);
            localStorage.setItem('ecred_parcelas', qtdParcelas);
            localStorage.setItem('ecred_prazo', n + ' meses');
        }
    </script>
</body>
</html>
