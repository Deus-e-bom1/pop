<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qual a sua renda - Ecred</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --green-primary: #a3e635; --green-dark: #65a30d; --bg-light: #f8faf8; --text-dark: #111827; --text-gray: #6b7280; --white: #ffffff; --border-color: #e5e7eb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--white); padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--text-dark); text-decoration: none; }
        .logo span { color: var(--green-dark); }
        .back-link { color: var(--text-gray); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .progress-container { width: 100%; height: 4px; background-color: #e5e7eb; }
        .progress-bar { height: 100%; width: 80%; background-color: var(--green-primary); border-radius: 0 4px 4px 0; }
        main { flex: 1; padding: 30px 15px; display: flex; flex-direction: column; align-items: center; max-width: 500px; margin: 0 auto; width: 100%; }
        .badge-simulacao { font-size: 11px; font-weight: 700; color: var(--text-gray); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 14px; color: var(--text-gray); text-align: center; margin-bottom: 25px; }
        .form-card { background-color: var(--white); border-radius: 20px; padding: 25px 20px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 15px; outline: none; }
        .input-group input:focus { border-color: var(--green-primary); }
        .checkbox-container { display: flex; align-items: center; gap: 10px; padding: 16px; border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; background-color: var(--bg-light); }
        .checkbox-container input { display: none; }
        .checkmark { width: 20px; height: 20px; border: 2px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: var(--white); }
        .checkbox-container input:checked ~ .checkmark { border-color: var(--green-primary); background-color: var(--green-primary); }
        .checkbox-container input:checked ~ .checkmark::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--text-dark); font-size: 10px; }
        .btn-continue { background-color: var(--green-primary); color: var(--text-dark); text-decoration: none; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: transform 0.2s; border: none; cursor: pointer; }
        .btn-continue.disabled { background-color: #def2ad; color: #a3a3a3; cursor: not-allowed; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">ecred<span>.</span></a><a href="dados.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar</a></header>
    <div class="progress-container"><div class="progress-bar"></div></div>
    <main>
        <div class="badge-simulacao">PASSO 5</div>
        <h1>Qual a sua renda?</h1>
        <p class="subtitle">Isso nos ajuda a ajustar as parcelas ao seu orçamento.</p>
        <div class="form-card">
            <div class="input-group">
                <label>Quanto você recebe por mês?</label>
                <input type="text" id="valor-renda" placeholder="R$ 0,00">
            </div>
            <label class="checkbox-container">
                <input type="checkbox" id="sem-renda">
                <span class="checkmark"></span>
                <span style="font-size: 14px; color: var(--text-gray);">Não possuo renda no momento</span>
            </label>
        </div>
        <div class="form-card">
            <div class="input-group" style="margin-bottom: 0;">
                <label>Que dia você recebe?</label>
                <p style="font-size: 12px; color: var(--text-gray); margin-bottom: 10px;">Digite o dia do salário ou benefício.</p>
                <input type="text" id="dia-recebimento" placeholder="Ex: 5" maxlength="2" inputmode="numeric">
            </div>
        </div>
        <button id="btn-continuar" onclick="window.location.href='analise.html'" class="btn-continue disabled">Continuar <i class="fa-solid fa-arrow-right"></i></button>
    </main>
    <script>
        const inputRenda = document.getElementById('valor-renda');
        const cbSemRenda = document.getElementById('sem-renda');
        const inputDia = document.getElementById('dia-recebimento');
        const btn = document.getElementById('btn-continuar');
        function verificar() {
            const sem = cbSemRenda.checked;
            const val = inputRenda.value !== '' && inputRenda.value !== 'R$ 0,00';
            const dia = inputDia.value.length > 0;
            if ((sem) || (val && dia)) btn.classList.remove('disabled');
            else btn.classList.add('disabled');
        }
        inputRenda.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            v = (v / 100).toFixed(2) + '';
            v = v.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            e.target.value = 'R$ ' + v;
            verificar();
        });
        cbSemRenda.addEventListener('change', (e) => {
            inputRenda.disabled = e.target.checked;
            inputDia.disabled = e.target.checked;
            if(e.target.checked) { inputRenda.value = ''; inputDia.value = ''; }
            verificar();
        });
        inputDia.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2);
            if(parseInt(e.target.value) > 31) e.target.value = 31;
            verificar();
        });
    </script>
</body>
</html>
