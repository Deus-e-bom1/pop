<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melhor dia para pagar - Ecred</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --green-primary: #a3e635; --green-dark: #65a30d; --bg-light: #f8faf8; --text-dark: #111827; --text-gray: #6b7280; --white: #ffffff; --border-color: #e5e7eb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--white); padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--text-dark); text-decoration: none; }
        .logo span { color: var(--green-dark); }
        .back-link { color: var(--text-gray); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .progress-container { width: 100%; height: 4px; background-color: #e5e7eb; }
        .progress-bar { height: 100%; width: 96%; background-color: var(--green-primary); border-radius: 0 4px 4px 0; }
        main { flex: 1; padding: 30px 15px; display: flex; flex-direction: column; align-items: center; max-width: 500px; margin: 0 auto; width: 100%; }
        .badge-simulacao { font-size: 11px; font-weight: 700; color: var(--text-gray); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 14px; color: var(--text-gray); text-align: center; margin-bottom: 25px; }
        .form-card { background-color: var(--white); border-radius: 20px; padding: 20px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .day-option { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 10px; text-align: center; cursor: pointer; position: relative; background-color: var(--white); }
        .day-option .day-number { font-size: 20px; font-weight: 700; color: var(--text-dark); display: block; margin-bottom: 2px; }
        .day-option .day-label { font-size: 10px; font-weight: 600; color: var(--text-gray); }
        .day-option.active { border-color: var(--green-primary); box-shadow: 0 0 0 1px var(--green-primary); background-color: rgba(163, 230, 53, 0.05); }
        .day-option.active .day-number { color: var(--green-dark); }
        .due-date-box { background-color: #f0f4ed; border-radius: 16px; padding: 16px; display: none; align-items: center; gap: 15px; border: 1px solid var(--border-color); margin-top: 5px; }
        .due-icon { width: 40px; height: 40px; background-color: #e2e8df; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #4b5e42; font-size: 18px; }
        .due-text strong { font-size: 14px; display: block; }
        .due-text span { font-size: 13px; color: var(--text-gray); }
        .btn-continue { background-color: var(--green-primary); color: var(--text-dark); text-decoration: none; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: transform 0.2s; border: none; cursor: pointer; }
        .btn-continue.disabled { background-color: #def2ad; color: #a3a3a3; cursor: not-allowed; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">ecred<span>.</span></a><a href="aprovacao.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar</a></header>
    <div class="progress-container"><div class="progress-bar"></div></div>
    <main>
        <div class="badge-simulacao">QUASE LÁ</div>
        <h1>Melhor dia para pagar</h1>
        <p class="subtitle">Escolha o dia do mês que combina com o seu orçamento.</p>
        <div class="form-card">
            <div class="days-grid">
                <label class="day-option" onclick="selecionarDia(this, 5)"><span class="day-number">5</span><span class="day-label">DIA</span></label>
                <label class="day-option" onclick="selecionarDia(this, 10)"><span class="day-number">10</span><span class="day-label">DIA</span></label>
                <label class="day-option" onclick="selecionarDia(this, 15)"><span class="day-number">15</span><span class="day-label">DIA</span></label>
                <label class="day-option" onclick="selecionarDia(this, 20)"><span class="day-number">20</span><span class="day-label">DIA</span></label>
                <label class="day-option" onclick="selecionarDia(this, 25)"><span class="day-number">25</span><span class="day-label">DIA</span></label>
                <label class="day-option" onclick="selecionarDia(this, 30)"><span class="day-number">30</span><span class="day-label">DIA</span></label>
            </div>
            <div class="due-date-box" id="due-box">
                <div class="due-icon"><i class="fa-regular fa-calendar-check"></i></div>
                <div class="due-text"><strong id="due-title">Vencimento todo dia 5</strong><span id="due-subtitle">1ª parcela em 05 de dezembro de 2026</span></div>
            </div>
        </div>
        <button id="btn-continuar" onclick="window.location.href='endereco.html'" class="btn-continue disabled">Continuar <i class="fa-solid fa-arrow-right"></i></button>
    </main>
    <script>
        function selecionarDia(el, dia) {
            document.querySelectorAll('.day-option').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('btn-continuar').classList.remove('disabled');
            document.getElementById('due-title').innerText = `Vencimento todo dia ${dia}`;
            const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            const hoje = new Date();
            let proxMes = hoje.getMonth() + 1;
            let ano = hoje.getFullYear();
            if(proxMes > 11) { proxMes = 0; ano++; }
            document.getElementById('due-subtitle').innerText = `1ª parcela em ${String(dia).padStart(2, '0')} de ${meses[proxMes]} de ${ano}`;
            document.getElementById('due-box').style.display = 'flex';
        }
    </script>
</body>
</html>
